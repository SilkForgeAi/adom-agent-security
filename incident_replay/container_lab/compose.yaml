services:
  cache:
    build:
      context: ../..
      dockerfile: incident_replay/container_lab/Dockerfile
    command: ["service.py"]
    environment: ["LAB_ROLE=cache"]
    user: "${LAB_UID:-10001}:${LAB_GID:-10001}"
    networks: [off_net, protected_services]
    volumes: ["./runtime/evidence:/evidence"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  scorer:
    build:
      context: ../..
      dockerfile: incident_replay/container_lab/Dockerfile
    command: ["service.py"]
    environment: ["LAB_ROLE=scorer"]
    user: "${LAB_UID:-10001}:${LAB_GID:-10001}"
    networks: [off_net, protected_services]
    volumes: ["./runtime/evidence:/evidence"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  target:
    build:
      context: ../..
      dockerfile: incident_replay/container_lab/Dockerfile
    command: ["service.py"]
    environment: ["LAB_ROLE=target"]
    user: "${LAB_UID:-10001}:${LAB_GID:-10001}"
    networks: [off_net, protected_services]
    volumes: ["./runtime/evidence:/evidence"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  broker:
    build:
      context: ../..
      dockerfile: incident_replay/container_lab/Dockerfile
    command: ["broker.py"]
    user: "${LAB_UID:-10001}:${LAB_GID:-10001}"
    networks: [agent_net, protected_services]
    volumes: ["./runtime/evidence:/evidence"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  agent-off:
    build:
      context: ../..
      dockerfile: incident_replay/container_lab/Dockerfile
    command: ["agent.py"]
    environment: ["LAB_MODE=off"]
    user: "${LAB_UID:-10001}:${LAB_GID:-10001}"
    networks: [off_net]
    volumes: ["./runtime/agent_off:/results"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  agent-adom:
    build:
      context: ../..
      dockerfile: incident_replay/container_lab/Dockerfile
    command: ["agent.py"]
    environment: ["LAB_MODE=adom"]
    user: "${LAB_UID:-10001}:${LAB_GID:-10001}"
    networks: [agent_net]
    volumes: ["./runtime/agent_adom:/results"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  off_net:
    internal: true
  agent_net:
    internal: true
  protected_services:
    internal: true
