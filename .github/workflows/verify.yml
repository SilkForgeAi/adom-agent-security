name: Verify evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and integration tests
        run: |
          python -B -m unittest discover -s incident_replay -p 'test_*.py'
          python -B -m unittest discover -s adom/integrations -p 'test_*.py'
          python -B cursor_hook/test_cursor_hook.py
          python -B cursor_hook/test_action_tiers.py
      - name: Run key-free latency, CLI, and encoding benchmark
        run: |
          python -B -m adom.cli --help > /dev/null
          python -B -m adom.cli bench
      - name: Verify deterministic evidence
        run: python -B incident_replay/verify.py incident_replay/results
      - name: Verify committed hashes
        run: |
          sha256sum -c incident_replay/MANIFEST.sha256
          sha256sum -c incident_replay/container_lab/MANIFEST.sha256
          sha256sum -c evidence/2026-10-08/MANIFEST.sha256
          (cd evidence/2026-11-14/frontier_scenarios && sha256sum -c MANIFEST.sha256)
          (cd evidence/2026-11-14/provider_conformance && sha256sum -c MANIFEST.sha256)
          (cd evidence/2026-11-15 && sha256sum -c MANIFEST.sha256)
          (cd evidence/2026-11-16 && sha256sum -c MANIFEST.sha256)
          (cd evidence/2026-11-17 && sha256sum -c MANIFEST.sha256)
      - name: Compile check all Python modules
        run: python3 -B -m compileall -q adom cursor_hook incident_replay
      - name: Verify selective-inference saved evidence (no API key)
        run: python -B benchmarks/request_grounding/verify.py
      - name: Test published selective-inference runtime
        working-directory: benchmarks/request_grounding/tests
        run: python -B -m unittest test_request_grounding_v2.V2Tests test_parameterized_workflow test_workflow_compiler -q
      - name: Compile published Python
        run: python -m compileall -q adom cursor_hook incident_replay benchmarks reproductions

